name: SingSync Android

# SingSync lives in /singsync of this repository (see singsync/DECISIONS.md D-00). Runs on every push that touches it.
on:
  push:
    paths: ["singsync/**", ".github/workflows/singsync-android.yml"]
  pull_request:
    paths: ["singsync/**", ".github/workflows/singsync-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: singsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg (FLAC round-trip test uses it as an independent decoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: C++ core – host build + tests
        run: |
          cmake -S core-audio/src/main/cpp -B build-host -G Ninja
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Kotlin core – unit tests (chunking, overlap-add, resume, FLAC, resampler)
        run: ./gradlew :common:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singsync-debug-apk
          path: singsync/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: singsync/common/build/reports/tests
