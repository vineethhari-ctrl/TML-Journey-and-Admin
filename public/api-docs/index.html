<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TML Admin Portal API</title>
    <style>
      body { margin: 0; }
      .banner { font: 13px system-ui, sans-serif; background: #0b2a5b; color: #fff; padding: 8px 16px; }
      .banner a { color: #bfdbfe; }
    </style>
  </head>
  <body>
    <div class="banner">
      TML Service Transformation — Admin Portal API (design contract).
      Raw spec: <a href="openapi.yaml" download>openapi.yaml</a> · Back to the <a href="../">portal</a>
    </div>
    <div id="redoc"></div>
    <!-- Redoc is served from this site (no CDN) so it also works on networks that block public CDNs -->
    <script src="vendor/redoc-2.5.4.standalone.js"></script>
    <script>
      Redoc.init(
        'openapi.yaml',
        {
          hideDownloadButton: false,
          expandResponses: '200,201',
          jsonSampleExpandLevel: 3,
          theme: { colors: { primary: { main: '#0b2a5b' } }, typography: { fontSize: '14px' } },
        },
        document.getElementById('redoc')
      );
    </script>
  </body>
</html>
